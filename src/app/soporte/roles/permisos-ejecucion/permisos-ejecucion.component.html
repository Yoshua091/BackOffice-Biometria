<div class="pb-3">
  <form [formGroup]="form" class="row" style="box-shadow: 0 3px 6px #00000029;">

    <div class="col-12 col-sm-5">
      <div class="group-form-material">
        <label for="filterHeaderAsesorField" [class.input-filled]="!!form.permiso.value">Permiso</label>
        <select id="filterHeaderAsesorField" class="w-100"
                [class.is-invalid]="form.permiso.invalid"
                [class.form-control-plaintext]="form.permiso.disabled"
                [class.bg-white]="form.permiso.disabled"
                [formControl]="form.permiso">
          <option *ngFor="let permiso of form.controls.permisosEjecucion.controls" [ngValue]="permiso">{{permiso.controls.menu.value}}</option>
        </select>
        <span class="highlight"></span>
        <span class="bar"></span>
        <div class="invalid-feedback">
          <span *ngIf="form.permiso.errors?.required">Por favor selecciona un valor.</span>
        </div>
      </div>
    </div>
  </form>

  <ng-container *ngIf="!!form.permiso.value">
    <div class="detalle mt-3" *ngFor="let modulo of form.permiso.value.controls.modulos.controls">

      <!-- CONTENIDO DETALLE MODULO -->
      <div class="row flex-grow-1 mx-0">
        <div class="col-12">
          <!-- ACCIONES -->
          <div class="row mx-0 pb-4 justify-content-between detalle-group border-bottom">
            <div class="col-4 d-flex flex-column align-items-start justify-content-center detalle-dato">
              <span class="titulo-seccion">{{modulo.controls.modulo.value | uppercase}}</span>
            </div>
            <div class="col-8">
              <div class="row">
                <ng-container *ngFor="let accion of modulo.controls.acciones.controls">
                  <div class="col-4">
                    <div class="d-flex detalle-dato">
                      <div class="custom-control custom-switch">
                        <input type="checkbox" class="custom-control-input"
                               id="rolesModuloAccionFieldSwitch{{ modulo.controls.id.value.toString() + accion.controls.id.value.toString() }}"
                               [formControl]="accion.controls.checked">
                        <label class="custom-control-label"
                               for="rolesModuloAccionFieldSwitch{{ modulo.controls.id.value.toString() + accion.controls.id.value.toString() }}"></label>
                      </div>
                      <span class="dato-valor">{{accion.controls.accion.value}}</span>
                    </div>
                  </div>
                </ng-container>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </ng-container>

  <div class="d-flex flex-row justify-content-end align-items-center mt-5">
    <button class="btn btn-primary" [disabled]="form.invalid" (click)="guardar()">
      GUARDAR
    </button>
  </div>
</div>
