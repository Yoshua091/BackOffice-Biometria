<div class="d-flex flex-column py-4" *ngIf="cantidad > 0">
    <table class="table">
      <tbody>
      <tr class="detalle-cliente" *ngFor="let propuesta of listado">
        <td>
          <app-card-desembolsos [propuesta]="propuesta" (reenviar)="reenviar($event)"></app-card-desembolsos>
        </td>
      </tr>
      </tbody>
    </table>
    <ngb-pagination class="align-self-center"
                    [collectionSize]="cantidad"
                    [(page)]="pagina"
                    [maxSize]="5"
                    [rotate]="true"
                    [pageSize]="cantidadPorPagina"
                    (pageChange)="pageChange.emit($event)">
    </ngb-pagination>
  </div>
  
  <div class="d-flex justify-content-center py-3" *ngIf="cantidad === 0">
    <span class="h4 align-self-center titulo-seccion">No hay solicitudes para mostrar</span>
  </div>
