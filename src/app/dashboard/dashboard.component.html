<div class="p-3">

  <div class="d-flex pt-4">
    <span class="h4">Informes</span>
  </div>

  <div class="propuestas-filter py-1">
    <ul class="nav-pills filter-options overflow-auto" ngbNav #navPendientes="ngbNav"
        [destroyOnHide]="false">
      <ng-container *ngFor="let informe of informes; let i = index">
        <li [ngbNavItem]="i">
          <a ngbNavLink>{{informe.titulo}}</a>
          <ng-template ngbNavContent>
            <iframe [src]="informe.url" class="m-3" style="height: 100vh; width: 100%; border: 0"></iframe>
          </ng-template>
        </li>
      </ng-container>
    </ul>
  </div>

  <div [ngbNavOutlet]="navPendientes"></div>
</div>
