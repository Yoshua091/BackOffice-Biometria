<div class="d-flex flex-column px-3">
    <app-registrar-comunicado (subirArchivo)="onSubirArchivos($event)"></app-registrar-comunicado>
    <div style="height: 843px;" class="my-4">
        <table class="table my-4">
            <tbody>
                <tr>

                    <td class="col-2">
                        <span class="font-weight-bold">T&iacute;tulo</span>
                    </td>
                    <td class="col-2">
                        <span class="font-weight-bold">Categor&iacute;a</span>
                    </td>
                    <td class="col-2">
                        <span class="font-weight-bold">Vigencia</span>
                    </td>
                    <td class="col-3">
                        <span class="font-weight-bold">Comunicado</span>
                    </td>
                    <td class="col-2">
                        <span class="font-weight-bold">Archivo PDF</span>
                    </td>
                    <td class="col-1">
                        <span class="font-weight-bold">Opciones</span>
                    </td>
                </tr>
                <tr *ngFor="let lista of comunicados">

                        <span class="font-weight-light">{{lista.comunicado?.titulo}}</span>
                    </td>
                    <td class="col-2">
                        <span class="font-weight-light">{{lista.comunicado?.seccion?.nombre}}</span>

                    <td class="col-2">
                        <span class="font-weight-light">{{lista.comunicado?.vigencia | date:'dd/MM/yyyy'}}</span>
                    </td>
                    <td class="col-3">
                        <span class="font-weight-light">{{lista.comunicado?.comunicado}}</span>
                    </td>
                    <td class="col-2">
                        <span class="font-weight-light"></span>
                    </td>
