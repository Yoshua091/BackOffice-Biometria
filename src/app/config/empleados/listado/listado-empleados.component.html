<div class="px-3">
  <div class="d-flex flex-row justify-content-between mt-5">
    <div>
      <span class="h4">Empleados</span>
    </div>
    <div>
      <a class="btn btn-primary" style="min-width: 136px;" (click)="registrar()">Nuevo</a>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="group-form-material">
        <input type="text" #nombre class="w-100" [formControl]="filter">
        <span class="highlight"></span>
        <span class="bar"></span>
        <label [class.input-filled]="nombre.value !== ''">Buscar</label>
        <div class="invalid-feedback">
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex py-4">
    <table class="table" *ngIf="!aviso">
      <tbody>
      <tr *ngFor="let empleado of empleados$ | async">

        <td class="text-left" style="min-width: 250px;">
          <span class="font-weight-bold">{{ empleado.nombre | titlecase }} {{ empleado.apellido | titlecase }}</span>
        </td>
        <td style="color: #545454; opacity: 0.5;"><span>{{ empleado.sucursal?.nombre | titlecase}}</span></td>
        <td><span>ID:{{ empleado.idUsuario }}</span></td>
        <td class="" style="color: #545454; opacity: 0.5;">
          <span>{{ empleado.rol?.rol | titlecase}}</span>
        </td>
        <td style="color: #545454; opacity: 0.5;">
          <span>{{ empleado.codigoAsesor }}</span>
        </td>
        <td class="text-left">
          <span>{{ empleado.perfil?.perfil | titlecase}}</span>
        </td>

        <td class="text-end pe-3">
  <div class="row justify-content-end flex-nowrap" style="margin:0;">
    <div class="col-auto" style="padding:0;">
      <button class="btn btn-outline-secondary btn-sm" (click)="modificar(empleado)">
        Editar
      </button>
    </div>
    <div class="col-auto" style="padding:0;">
      <button class="btn btn-outline-secondary btn-sm" (click)="borrar(empleado)">
        Borrar
      </button>
    </div>
  </div>
</td>
        
      </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-center py-3" *ngIf="aviso">
    <span class="h4 align-self-center titulo-seccion">No hay resultados para esta b&uacute;squeda</span>
  </div>
</div>
