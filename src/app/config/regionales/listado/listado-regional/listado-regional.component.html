<div class="px-3">
    <div class="d-flex flex-row justify-content-between mt-5">
        <div><span class="h4">Regionales</span></div>
        <div><a class="btn btn-primary" style="min-width: 136px;" (click)="registrar()">Nueva</a></div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="group-form-material">
                <input type="text" #nombre class="w-100" [formControl]="filter">
                <span class="highlight"></span>
                <span class="bar"></span>
                <label [class.input-filled]="nombre.value !== ''">Buscar</label>
                <div class="invalid-feedback">
                </div>
            </div>
        </div>
    </div>
    <div class="d-flex py-4">
        <table class="table" *ngIf="!aviso">
            <tbody>
                <tr class="d-flex" *ngFor="let regional of regionales$ | async; index as i">
                    <td class=" col-3"><strong>ID:{{ regional.idRegion }}</strong></td>
                    <td class="text-left col-3">
                        <span>{{ regional.nombre | titlecase }}</span>
                    </td>
                    <td class="text-left col-3">
                        <span>{{ regional?.usuarioGerente?.nombre | titlecase }} {{ regional?.usuarioGerente?.apellido | titlecase }}</span>
                    </td>
                    <td class="d-flex justify-content-between align-items-center">
                        <a class="btn btn-outline-secondary" style="min-width: 125px"
                            (click)="modificar(regional)">Editar</a>
                        <a class="btn btn-outline-secondary" style="min-width: 125px" (click)="borrar(regional)">Borrar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-center py-3" *ngIf="aviso">
        <span class="h4 align-self-center titulo-seccion">No hay resultados para esta b&uacute;squeda</span>
    </div>
</div>
