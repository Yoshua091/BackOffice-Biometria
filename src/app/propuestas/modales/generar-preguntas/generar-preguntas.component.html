<div id="modal-validar-otp" class="px-2">
    <div class="modal-header">
        <h4 class="modal-title" id="modal-basic-title">Preguntas de seguridad</h4>
        <a class="close icon-close text-primary" (click)="modal.dismiss('Cross click')"></a>
    </div>
    <form novalidate (ngSubmit)="enviarRespuestas(f)" #f="ngForm">
        <div class="modal-body px-5">

            <div *ngFor="let pregunta of data.preguntas; let i = index">
                <span class="pregunta">{{ i + 1 }}. {{ pregunta.pregunta }}</span>
                <ul class="respuestas-lista">
                    <li *ngFor="let respuesta of pregunta.respuestas">
                        <label class="form-group form-check">
                            <input id="empleadosFormLiderField" type="radio" required ngModel
                                [name]="'respuesta' + pregunta.idPregunta"
                                [(ngModel)]="respuestaSeleccionada[pregunta.idPregunta]" [value]="respuesta.idRespuesta"
                                class="form-check-input">
                            {{ respuesta.valor }}
                            <span class="checkmark"></span>
                        </label>
                    </li>
                </ul>
            </div>


        </div>
        <div class="modal-footer border-0">
            <div class="row w-100 justify-content-center">
                <div class="col-4">
                    <button class="btn btn-primary w-100" [disabled]="f.invalid">
                        Validar
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>
