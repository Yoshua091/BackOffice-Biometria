<div id="modal-sin-acuerdo-pago" class="px-2">
    <div class="modal-header py-3">
        <h4 class="modal-title titulo" id="modal-basic-title">Listado usuarios rol comite</h4>
        <button type="button" class="close icon-close text-primary" (click)="modal.dismiss('Cross click')">
        </button>
    </div>

    <div class="modal-body container">
        <div class="row">
            <div class="col-9 d-flex justify-content-center">
                <strong>Nombre</strong>
            </div>
            <div class="col-3 d-flex justify-content-center">
                <strong># Asignaciones</strong>
            </div>
        </div>
        <div class="row item mt-2" *ngFor="let user of comite"
            [class.selected]="selectedUser? user.idUsuario === selectedUser?.idUsuario : false"
            (click)="selectUser(user)">
            <div class="col-9">{{user.nombre}} {{user.apellido}}</div>
            <div class="col-3 d-flex justify-content-center">{{user.counter}}</div>
        </div>
        <div class="row mt-3 d-flex justify-content-center">
            <button class="col-6 btn btn-primary" (click)="saveUserSelected()">Guardar</button>
        </div>
    </div>
</div>
