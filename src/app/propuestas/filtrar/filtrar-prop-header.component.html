<div class="pb-3">
  <form [formGroup]="form" class="row" style="box-shadow: 0 3px 6px #00000029;">

    <div class="col-12 col-sm-5">
      <div class="group-form-material">
        <label for="filterHeaderSucursalField" [class.input-filled]="form.controls.sucursal_id.value !== ''">Sucursal</label>
        <select id="filterHeaderSucursalField" class="w-100"
                [class.is-invalid]="form.controls.sucursal_id.invalid"
                [class.form-control-plaintext]="form.disabled"
                [class.bg-white]="form.disabled"
                formControlName="sucursal_id">
          <option *ngFor="let sucursal of sucursales" [ngValue]="sucursal._id">{{sucursal.nombre}}</option>
        </select>
        <span class="highlight"></span>
        <span class="bar"></span>
        <div class="invalid-feedback">
          <span *ngIf="form.controls.sucursal_id.errors?.required">Por favor selecciona un valor.</span>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-5">
      <div class="group-form-material">
        <label for="filterHeaderAsesorField" [class.input-filled]="form.controls.asesor_id.value !== ''">Asesor</label>
        <select id="filterHeaderAsesorField" class="w-100"
                [class.is-invalid]="form.controls.asesor_id.invalid"
                [class.form-control-plaintext]="form.disabled"
                [class.bg-white]="form.disabled"
                formControlName="asesor_id">
          <option *ngFor="let asesor of asesores" [ngValue]="asesor._id">{{asesor.nombre}}</option>
        </select>
        <span class="highlight"></span>
        <span class="bar"></span>
        <div class="invalid-feedback">
          <span *ngIf="form.controls.asesor_id.errors?.required">Por favor selecciona un valor.</span>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-2" style="padding-top: 40px">
      <a class="btn btn-primary w-100" (click)="limpiar()">
        Limpiar Filtro
      </a>
    </div>
  </form>
</div>

<app-lista-propuestas [listado]="solicitudes || []"
                      [cantidad]="solicitudes?.length || 0"
                      [cantidadPorPagina]="cantidadPorPagina"
                      (pageChange)="pageChange($event)"></app-lista-propuestas>
